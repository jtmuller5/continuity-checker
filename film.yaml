# The five-shot cut.
#
# Five shots, 8 seconds each, 40 seconds of film. Eight seconds is not a taste:
# veo-3.1-generate-001 only supports 8s for reference-image-to-video, and the
# re-render step feeds the previous shot's last frame back in. See
# notes/render-cost.md.
#
# `continuity` is the state the shot is rendered in. Two shots below are
# deliberately wrong, so the checker (#1013) has something real to catch before
# any Veo frame exists. `expected_breaks` is the answer key — it is never given
# to the checker, only used to score it.

title: The Courier
fps: 24
aspect: "16:9"

# Rung 1 renders at the smallest size that still plays. The Veo backend
# overrides this with its own resolution ladder.
resolution: 320x180

# How a shot is rendered, as opposed to what is in it. Overridden per run by
# --tier, --seed and --resolution, and folded into the cache key by
# cinema/render.py — but only the parts the chosen backend says it reads.
#
# Iterate on lite and spend standard only on the shots a judge watches: a
# standard pass is $16.00 against $1.20 for lite. notes/render-cost.md.
render:
  tier: lite
  seed: 20260813
  audio: false

# The shot bible: what is true of this film before a frame exists.
#
# It writes the prompt, it gives the checker its questions, and its `rule` says
# whether a change is an error. That last one is the point: the jacket must
# never change colour, and the light must go from dusk to night. cinema/bible.py
# has the rules; `python3 -m cinema bible` prints what this makes.
bible:
  characters:
    - id: courier
      name: The courier
      description: >-
        The same bicycle courier in every shot — late twenties, close-cropped
        dark hair, a canvas satchel worn across the back.

  props:
    - id: parcel
      name: The parcel
      description: >-
        A flat brown paper parcel about the size of a hardback book, tied once
        with pale string.

  attributes:
    - name: jacket
      subject: courier
      rule: constant
      canon: red
      values: [red, blue, green, black]
      question: What colour is the courier's jacket?
      describe: "the courier wears a zipped {value} cycling jacket"
      synonyms:
        red: [crimson, scarlet, dark red, bright red]
        blue: [navy, dark blue, cobalt]
        black: [dark, charcoal]

    - name: parcel
      subject: parcel
      rule: constant
      canon: present
      values: [present, absent]
      question: Is the courier carrying a flat brown paper parcel?
      hides_subject: [absent]
      describe:
        present: the courier is carrying the brown parcel, plainly in frame
        absent: the courier carries nothing, and no parcel is anywhere in frame
      synonyms:
        present: [yes, carrying it, visible]
        absent: [no, not carrying it, gone]

    # Time of day moves forward and never back, so dusk -> night is the story
    # and night -> dusk is a break. A constant rule here would flag every shot
    # after the light goes.
    - name: time_of_day
      rule: progressive
      canon: dusk
      order: [dawn, day, dusk, night]
      question: Is the light dawn, day, dusk or night?
      describe: "shot at {value}"
      synonyms:
        dusk: [evening, twilight, sunset]
        night: [after dark, dark, nighttime]
        day: [daytime, midday, afternoon]
        dawn: [sunrise, first light]

shots:
  - id: s01
    slug: doorway
    seconds: 8
    prompt: >-
      Wide shot. A bicycle courier steps out of a narrow doorway onto a wet
      street at dusk, a flat brown parcel under one arm.
    continuity:
      jacket: red
      parcel: present
      time_of_day: dusk

  - id: s02
    slug: canal
    seconds: 8
    prompt: >-
      Medium tracking shot. The courier walks along a canal, parcel held against
      the chest, streetlights coming on behind.
    continuity:
      jacket: red
      parcel: present
      time_of_day: dusk

  - id: s03
    slug: phone
    seconds: 8
    prompt: >-
      Close shot. The courier stops under an awning and checks a phone for the
      address.
    continuity:
      jacket: blue        # BREAK: was red in s01 and s02
      parcel: present
      time_of_day: dusk

  - id: s04
    slug: stairs
    seconds: 8
    prompt: >-
      Medium shot from below. The courier climbs an outdoor stairwell two steps
      at a time.
    continuity:
      jacket: red
      parcel: absent      # BREAK: the parcel was in frame in every earlier shot
      time_of_day: night

  - id: s05
    slug: doorstep
    seconds: 8
    prompt: >-
      Wide shot. The courier hands the parcel over at a lit doorway and turns
      away down the steps.
    continuity:
      jacket: red
      parcel: present
      time_of_day: night

# The answer key. Not passed to the checker.
expected_breaks:
  - shot: s03
    attribute: jacket
    from: red
    to: blue
  - shot: s04
    attribute: parcel
    from: present
    to: absent
